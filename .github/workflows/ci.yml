name: ci

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so the breaking slice can diff proto against origin/main.
          fetch-depth: 0
      - uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2
        with:
          disable-metrics: "true"
      - name: Run the gate
        env:
          FLOX_DISABLE_METRICS: "true"
        run: flox activate -- make validate
