name: ci

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags so the breaking slice can diff proto against
          # the previous release tag (a pull request's base branch on PRs).
          fetch-depth: 0
      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2.6.0
        with:
          disable-metrics: "true"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flox
          key: flox-${{ runner.os }}-${{ hashFiles('.flox/env/manifest.lock') }}
      - name: Run the gate
        env:
          FLOX_DISABLE_METRICS: "true"
        run: flox activate -- make validate
