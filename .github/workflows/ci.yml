name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (format, lint, types, policy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2
      - uses: flox/activate-action@7065dcbe5583b7b015f07a8ebd49d7266e3053e8 # v1
        with:
          command: make quality

  test:
    name: Test and coverage (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Go
            command: make coverage-go
          - language: Go race
            command: make race-go
          - language: Python
            command: make coverage-python
          - language: Rust
            command: make coverage-rust
          - language: TypeScript
            command: make coverage-typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2
      - uses: flox/activate-action@7065dcbe5583b7b015f07a8ebd49d7266e3053e8 # v1
        with:
          command: ${{ matrix.command }}

  security:
    name: Security (secrets, integrity, vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2
      - uses: flox/activate-action@7065dcbe5583b7b015f07a8ebd49d7266e3053e8 # v1
        with:
          command: make security

  generated:
    name: Generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2
      - uses: flox/activate-action@7065dcbe5583b7b015f07a8ebd49d7266e3053e8 # v1
        with:
          command: make verify-generate

  integration:
    name: Integration (Git installs, Connect, PostgreSQL, Atlas, ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2
      - uses: flox/activate-action@7065dcbe5583b7b015f07a8ebd49d7266e3053e8 # v1
        with:
          command: make integration

  breaking:
    name: Protobuf breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Ensure base commit is available
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}"
          fi

      - uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2
      - uses: flox/activate-action@7065dcbe5583b7b015f07a8ebd49d7266e3053e8 # v1
        with:
          command: make breaking BASE_REF=${{ github.event.pull_request.base.sha }}
