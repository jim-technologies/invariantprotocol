## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##   https://flox.dev/docs/reference/command-reference/manifest.toml/
##
## -------------------------------------------------------------------
# Flox manifest version managed by Flox CLI
schema-version = "1.11.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
python3.pkg-path = "python3"
buf.pkg-path = "buf"
uv.pkg-path = "uv"
go.pkg-path = "go"
protobuf.pkg-path = "python313Packages.protobuf"
protobuf.version = ">=6.33.5"
protobuf.outputs = "all"
grpcio.pkg-path = "python313Packages.grpcio"
grpcio.outputs = "all"
grpcio-tools.pkg-path = "python313Packages.grpcio-tools"
grpcio-tools.outputs = "all"
pytest.pkg-path = "python313Packages.pytest"
pytest.outputs = "all"
pyyaml.pkg-path = "python313Packages.pyyaml"
pyyaml.outputs = "all"
protoc-gen-go.pkg-path = "protoc-gen-go"
golangci-lint.pkg-path = "golangci-lint"
ruff.pkg-path = "ruff"
protoc.pkg-path = "protobuf"
protoc.version = ">=33.5"

# Rust toolchain. Lock to a stable channel via flox-provided rustc/cargo so
# nothing pulls a different toolchain at build time. clippy + rustfmt mirror
# the lint/format role of golangci-lint + ruff in the other two languages.
rustc.pkg-path = "rustc"
cargo.pkg-path = "cargo"
clippy.pkg-path = "clippy"
rustfmt.pkg-path = "rustfmt"
# rust-analyzer for editor integration; not used by CI but harmless.
rust-analyzer.pkg-path = "rust-analyzer"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# Pin uv to flox's Python 3.13. Without this, uv downloads its own Python
# (3.14 by default), builds C extensions like grpcio's cygrpc against that
# ABI, and the resulting .so cannot load when run via flox-activated python.
UV_PYTHON_DOWNLOADS = "never"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = '''
  export UV_PYTHON="$(command -v python3.13)"
'''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# common = '''
#   gum style \
#   --foreground 212 --border-foreground 212 --border double \
#   --align center --width 50 --margin "1 2" --padding "2 4" \
#     $INTRO_MESSAGE
# '''
## Shell-specific customizations such as setting aliases go here:
# bash = ...
# zsh  = ...
# fish = ...


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
# environments = [
#     { dir = "../common" }
# ]


