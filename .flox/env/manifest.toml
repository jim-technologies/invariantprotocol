schema-version = "1.12.0"

[install]
python3.pkg-path = "python314"
python3.version = "python3-3.14.6"
buf.pkg-path = "buf"
uv.pkg-path = "uv"
uv.version = ">=0.11.26"
go.pkg-path = "go"
# Flox currently supplies the bootstrap command. GOTOOLCHAIN below selects the
# exact patched Go release through Go's checksum-verified toolchain mechanism.
go.version = "1.26.4"
nodejs.pkg-path = "nodejs_24"
nodejs.version = ">=24.18.0"
# Native Python wheels such as grpcio link libstdc++ on Linux. GCC supplies the
# runtime library and also covers source-build fallbacks for native extensions.
gcc.pkg-path = "gcc16"
protoc-gen-go.pkg-path = "protoc-gen-go"
protoc-gen-go-grpc.pkg-path = "protoc-gen-go-grpc"
protoc-gen-go-grpc.version = "1.6.2"
golangci-lint.pkg-path = "golangci-lint"
ruff.pkg-path = "ruff"
protoc.pkg-path = "protobuf"
protoc.version = ">=34.1"

# Rust toolchain. Lock to a stable channel via flox-provided rustc/cargo so
# nothing pulls a different toolchain at build time. clippy + rustfmt mirror
# the lint/format role of golangci-lint + ruff in the other two languages.
rustc.pkg-path = "rustc"
rustc.version = "1.96.1"
rustc.pkg-group = "rust-toolchain"
cargo.pkg-path = "cargo"
cargo.version = "1.96.1"
cargo.pkg-group = "rust-toolchain"
cargo-llvm-cov.pkg-path = "cargo-llvm-cov"
cargo-llvm-cov.version = "0.8.5"
clippy.pkg-path = "clippy"
clippy.version = "1.96.1"
clippy.pkg-group = "rust-toolchain"
rustfmt.pkg-path = "rustfmt"
rustfmt.version = "1.96.1"
rustfmt.pkg-group = "rust-toolchain"
# Match rustc's embedded LLVM so coverage profiles and reports use the same
# instrumentation format on every supported development system.
llvm.pkg-path = "llvm_21"
llvm.version = "21.1.8"
# rust-analyzer for editor integration; not used by CI but harmless.
rust-analyzer.pkg-path = "rust-analyzer"
gitleaks.pkg-path = "gitleaks"
cargo-audit.pkg-path = "cargo-audit"
govulncheck.pkg-path = "govulncheck"
actionlint.pkg-path = "actionlint"
shellcheck.pkg-path = "shellcheck"
shellcheck.version = "0.11.0"
# Atlas validates that emitted PostgreSQL desired-state SQL is accepted by the
# real migration boundary documented by this project.
atlas.pkg-path = "atlas"
atlas.version = "1.2.3"

[vars]
# Keep uv on the same Python 3.14 interpreter as the reproducible Flox
# environment instead of downloading a separate interpreter.
UV_PYTHON_DOWNLOADS = "never"
# Flox's catalog can lag a Go security patch. Select the exact release
# explicitly instead of letting `auto` choose an unreviewed newer toolchain.
GOTOOLCHAIN = "go1.26.5+auto"
# Flox supplies llvm-cov and llvm-profdata directly rather than through rustup.
CARGO_LLVM_COV_SETUP = "no"

[hook]
on-activate = '''
  export UV_PYTHON="$(command -v python3.14)"
  if [ "$(uname -s)" = "Linux" ]; then
    libstdcpp="$(gcc -print-file-name=libstdc++.so.6)"
    if [ -f "$libstdcpp" ]; then
      export LD_LIBRARY_PATH="$(dirname "$libstdcpp")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    fi
  fi
'''

[options]
# Keep one current lock across the supported development platforms. Intel macOS
# consumers can still use their language-native toolchains; the Flox catalog no
# longer publishes every current toolchain for that platform.
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
