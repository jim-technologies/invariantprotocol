      post: "/v1/books"
      body: "body"
      response_body: "book"
    };
  }

  // Get a book
  rpc GetBook(GetBookRequest) returns (GetBookResponse) {
    option (google.api.http) = {
      get: "/v1/books/{book_id}"
      response_body: "book"
    };
  }
}

