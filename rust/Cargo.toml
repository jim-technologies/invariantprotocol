[package]
name = "invariant-protocol"
version = "0.11.0"
edition = "2024"
rust-version = "1.96"
description = "Project gRPC services into Connect/gRPC/MCP/CLI interfaces from proto descriptors"
license = "Apache-2.0"
repository = "https://github.com/jim-technologies/invariantprotocol"
publish = false

[workspace]
members = ["codegen"]
resolver = "3"

[lib]
name = "invariant"
path = "src/lib.rs"

# Why these deps:
# - prost / prost-reflect: descriptor parsing + dynamic messages, mirrors what
#   Go does with google.golang.org/protobuf/types/dynamicpb and what Python does
#   with google.protobuf.descriptor_pool. We never want the user's handlers to
#   touch DynamicMessage — only the wire boundary does.
# - tonic / tonic-prost: generated clients, generated service traits, native
#   gRPC codecs and transport. The descriptor compiler emits the small adapter
#   that also captures unary/server-streaming projection bindings.
# - axum: HTTP/Connect server. Same hand-rolled Connect
#   protocol (envelope framing, error envelope, Connect-Timeout-Ms) that
#   the Go and Python projections implement.
# - tokio: async runtime; required for both tonic and axum.
# - thiserror: structured error types.
# - parking_lot: non-poisoning RwLock keeps configuration failures local and
#   avoids propagating lock-poison errors through every request API.
[dependencies]
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde", "text-format"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
http = "1"
tonic-reflection = "0.14"
tonic-prost = "0.14"
tonic-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "macros", "tokio"] }
http-body-util = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
futures = "0.3"
async-stream = "0.3"
tower = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
criterion = { version = "0.8", features = ["async_tokio"] }

[build-dependencies]
invariant-protocol-codegen = { path = "codegen" }
prost = "0.14"
prost-types = "0.14"

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
