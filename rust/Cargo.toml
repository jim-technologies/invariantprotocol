[package]
name = "invariant-protocol"
version = "0.6.1"
edition = "2024"
rust-version = "1.95"
description = "Project gRPC services into Connect/gRPC/MCP/CLI interfaces from proto descriptors"
license = "Apache-2.0"
repository = "https://github.com/jim-technologies/invariantprotocol"
publish = false

[lib]
name = "invariant"
path = "src/lib.rs"

# Why these deps:
# - prost / prost-reflect: descriptor parsing + dynamic messages, mirrors what
#   Go does with google.golang.org/protobuf/types/dynamicpb and what Python does
#   with google.protobuf.descriptor_pool. We never want the user's handlers to
#   touch DynamicMessage — only the wire boundary does.
# - tonic: gRPC server. We bypass its codegen and register routes manually
#   against a tower::Service so dispatch stays descriptor-driven.
# - axum + tower + hyper: HTTP/Connect server. Same hand-rolled Connect
#   protocol (envelope framing, error envelope, Connect-Timeout-Ms) that
#   the Go and Python projections implement.
# - tokio: async runtime; required for both tonic and axum.
# - thiserror: structured error types.
# - parking_lot: faster RwLock than std for the tool registry hot path.
[dependencies]
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde", "text-format"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
http = "1"
http-body = "1"
tonic-reflection = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "signal", "time", "fs"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "macros", "tokio"] }
hyper = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"
async-stream = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
criterion = { version = "0.8", features = ["async_tokio"] }
prost-build = "0.14"
tonic-prost = "0.14"

[build-dependencies]
prost-build = "0.14"

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
