[project]
name = "invariant-protocol"
version = "0.7.0"
description = "Project protobuf/gRPC services into MCP, CLI, HTTP, and logical data schemas"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "protobuf>=7.35.1",
    "grpcio>=1.82.1",
    "grpcio-reflection>=1.82.1",
    "googleapis-common-protos>=1.75.0",
    "httpx>=0.28.1",
    "uvicorn>=0.51.0",
    "protovalidate>=1.2.0",
]

[project.optional-dependencies]
data = ["pyarrow>=25.0.0"]

[project.scripts]
invariant-check-proto-comments = "invariant.proto_comments:main"

[dependency-groups]
dev = [
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ty>=0.0.59",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant", "src/buf"]

[tool.ruff]
line-length = 120
exclude = ["gen/", "*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
]
ignore = [
    "E501",    # line length (formatter handles it)
    "N802",    # PascalCase methods on servicers match proto RPC names
    "SIM105",  # contextlib.suppress not always clearer than try/except/pass
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S603", "PT015", "PT017", "B011"]

# ── ty: static type checker (Astral, pre-1.0) ──
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
# The protobuf Python generator does not emit type stubs, so generated module
# attributes need narrow file-level exceptions below. Keep general call,
# operator, reference, and attribute checking enabled everywhere else.
possibly-unresolved-reference = "error"

[[tool.ty.overrides]]
include = [
    "src/invariant/data_arrow.py",
    "src/invariant/descriptor.py",
    "src/invariant/errors.py",
    "src/invariant/http_client.py",
    "src/invariant/proto_comments.py",
    "src/invariant/schema.py",
    "src/invariant/server.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
