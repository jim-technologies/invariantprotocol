[project]
name = "invariant-protocol"
version = "0.16.0"
description = "Project protobuf/gRPC services into MCP, CLI, HTTP, and logical data schemas"
requires-python = ">=3.14"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "protobuf>=7.35.1",
    "grpcio>=1.82.1",
    "grpcio-reflection>=1.82.1",
    "googleapis-common-protos>=1.75.0",
    "httpx>=0.28.1",
    "uvicorn>=0.51.0",
    "protovalidate>=1.2.0",
]

[project.optional-dependencies]
data = ["pyarrow>=25.0.0"]

[project.scripts]
invariant-check-proto-comments = "invariant.proto_comments:main"

[project.urls]
Repository = "https://github.com/jim-technologies/invariantprotocol"

[dependency-groups]
dev = [
    "grpcio-tools>=1.82.1",
    "lancedb==0.36.0",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "types-grpcio>=1.82.1.20260711",
    "types-grpcio-reflection>=1.0.0.20260508",
    "types-protobuf>=7.34.1.20260518",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant", "src/buf"]

[tool.ruff]
line-length = 120
exclude = ["gen/", "*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
]
ignore = [
    "E501",    # line length (formatter handles it)
    "N802",    # PascalCase methods on servicers match proto RPC names
    "SIM105",  # contextlib.suppress not always clearer than try/except/pass
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S603", "PT015", "PT017", "B011"]

# ── mypy: stable static type checker ──
[tool.mypy]
python_version = "3.14"
files = ["src/invariant"]
exclude = ["^src/invariant/gen/"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["google.api.*", "google.rpc.*", "pyarrow"]
# These generated/extension modules do not publish PEP 561 metadata. Keep the
# exception at the dependency boundary; authored Invariant code stays checked.
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["invariant"]
omit = ["src/invariant/gen/*"]

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true
