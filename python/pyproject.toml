[project]
name = "invariant-protocol"
version = "0.2.7"
description = "Project gRPC services into MCP, CLI, and HTTP interfaces from proto descriptors"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=4.25.0",
    "grpcio>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "googleapis-common-protos>=1.66.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "protovalidate>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ty",
    "pip-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant", "src/buf"]

[tool.ruff]
line-length = 120
exclude = ["gen/", "*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
]
ignore = [
    "E501",    # line length (formatter handles it)
    "N802",    # PascalCase methods on servicers match proto RPC names
    "SIM105",  # contextlib.suppress not always clearer than try/except/pass
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S603", "PT015", "PT017", "B011"]

# ── ty: static type checker (Astral, pre-1.0) ──
[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
# This is a descriptor-driven protobuf library: it introspects dynamically
# generated message/descriptor classes, which a pre-1.0 checker can't model, so
# these categories are ~entirely false positives. Documented and scoped; the
# rules that catch real bugs (undefined names, possibly-unbound, unresolved
# imports — the one protobuf-stub gap is inline-ignored) stay on.
unresolved-attribute = "ignore"   # dynamic protobuf descriptor introspection
unsupported-operator = "ignore"   # bytes/int narrowing the checker misses
invalid-argument-type = "ignore"  # incomplete stdlib stubs (e.g. asyncio.create_task)

[tool.pytest.ini_options]
asyncio_mode = "auto"
