version: v2
plugins:
  - local: ../node_modules/.bin/protoc-gen-es
    out: ../typescript/src/gen
    opt: target=ts,import_extension=.js
inputs:
  # Pin the BSR commit so rich gRPC status bindings are reproducible and do
  # not change merely because googleapis moves its main label.
  - module: buf.build/googleapis/googleapis:c17df5b2beca46928cc87d5656bd5343 # gitleaks:allow -- public BSR commit
    paths:
      - google/rpc/error_details.proto
      - google/rpc/status.proto
