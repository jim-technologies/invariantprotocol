version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
    - COMMENTS
  ignore_only:
    COMMENT_ONEOF:
      # Vendored byte-for-byte from the upstream CloudEvents v1.0.2 schema,
      # whose two oneofs carry no comments; the file stays unmodified.
      - io/cloudevents/v1/cloudevents.proto
